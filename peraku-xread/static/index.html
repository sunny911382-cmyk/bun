<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peraku-Xread</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div class="logo">Peraku<span>-Xread</span></div>
    <div class="sub">Financial Awareness & Mortgage Preparation</div>
    <div id="header-user" style="margin-left:auto;display:flex;align-items:center"></div>
  </header>

  <nav class="stepper">
    <div class="step active" data-step="1">
      <span class="num">1</span> Profile Type
    </div>
    <div class="step" data-step="2">
      <span class="num">2</span> Upload Documents
    </div>
    <div class="step" data-step="3">
      <span class="num">3</span> Cross-Reference Review
    </div>
    <div class="step" data-step="4">
      <span class="num">4</span> Credit Profile
    </div>
    <div class="step" data-step="5">
      <span class="num">5</span> Report
    </div>
  </nav>

  <main class="main">
    <div id="view"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
